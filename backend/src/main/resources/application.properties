spring.application.name=careerpilot-ai

# Port — Northflank injects PORT; falls back to 8080 for local dev
server.port=${PORT:8080}

# Database — override with env vars in production (Northflank runtime variables)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/careerpilot_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root@123}

# JPA — use 'validate' in production to prevent accidental schema changes
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# CORS — include both local dev origins and Vercel production origin
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:5174,https://careerpilot-ai-4l7u.vercel.app}

# JWT — override secret with a strong env var in production
jwt.secret=${JWT_SECRET:mySecretKeyForCareerPilotApplication123456789}
jwt.expiration=${JWT_EXPIRATION:86400000}